[package]
name = "eve-maj-preview"
description = "Live DWM thumbnails of EVE Online clients"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "eve-maj-preview"
path = "src/main.rs"

[dependencies]
eve-maj-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
eve-maj-app = { path = "../app" }
eve-maj-win = { path = "../win" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux front end (Hyprland): Wayland layer-shell overlays, GPU window capture, cairo/pango text.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.16"
gbm = { version = "0.18", default-features = false }
drm-fourcc = "2"
cairo-rs = "0.21"
pango = "0.21"
pangocairo = "0.21"
libc = "0.2"
bitflags = "2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[build-dependencies]
embed-resource = "3"
